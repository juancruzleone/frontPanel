# OpenSpec SDD Configuration — frontGMAO
# Generated by sdd-init (change: super-admin-dashboard-redesign, mode: engram, execution: auto)
# Review budget: 800 lines (ask-on-risk). Do not widen scope without explicit approval.

project: frontGMAO
change: super-admin-dashboard-redesign
artifact_store: engram
execution_mode: auto
delivery_strategy: ask-on-risk
review_budget: 800
strict_tdd: true

context: |
  GMAO multi-tenant frontend: React 19.2.8 + Vite 8.1.5 + Zustand 5.0.14 + React Router 8.3.0 + Bun 1.3.5.
  Backend consumed: backPanel (Node 24 + Express 5 + MongoDB/Mongoose 9, JWT httpOnly cookies gmao_auth/gmao_refresh).
  Redesign scope: super_admin dashboards (PanelAdmin + Tenants) — currently minimal/visual debt vs. admin HomeDashboard
  (OperationalKPIs, WorkOrderStatusDistribution, RecentWorkOrders, LineChart, AttentionRequired, InventorySummary).
  Goal: Visual parity with admin/tecnico dashboards, shadcn/ui-inspired system (avoid AI-generated look: no gradient-clip titles,
  no glassmorphism overuse), grounded in existing tokens (--color-bg, --color-card, --color-primary, --color-secondary #057E74).
  Must respect i18n, dark/light themes, and responsive layout constraints (12-col grid, 1320px max). No backend schema change
  unless aggregation for evolutionData/statusDistribution is incomplete.

stack:
  runtime: "node >=24.0.0 <25, bun >=1.3.5"
  framework: "react 19.2.8 + vite 8.1.5 + react-router 8.3.0"
  state: "zustand 5.0.14 (persist middleware, localStorage auth-storage, sessionStorage csrf-storage)"
  package_manager: "bun 1.3.5 (bun.lock frozen)"
  backend: "backPanel @ https://api.leonix.net.ar (express 5.2.1, mongodb 7.5.0)"
  realtime: "socket.io-client 4.8.3"
  i18n: "i18next 26.3.6 + react-i18next 17.0.11"
  security: "yup 1.7.1 validation, CSRF, httpOnly cookies, helmet (backend)"
  pwa: "service worker (sw.js), offlineTrustStore, OfflineSyncManager"
  ui_target: "shadcn/ui-inspired primitives (Radix-like headless + CSS tokens), lucide-react 1.27.0, recharts 3.10.1 — install tailwind/shadcn only if review-budget justified; otherwise replicate with CSS modules + tokens"

conventions:
  commits: "Conventional Commits: Feat:, Fix:, Chore:, Docs:, Test:, Refactor: — no Co-Authored-By"
  i18n: "all user strings via t(), routeTranslations for localized routes"
  async: "async/await, no console.log in production, Zustand actions for state"
  security: "no secrets committed, env vars VITE_API_URL/VITE_API_PROXY_TARGET, validate inputs"
  branching: "main (prod) / develop (staging), PRs require description and size check"
  never: "no build after changes, no CSRF disable in prod, no git push --force"
  ui: "avoid AI-generated look: flat typography, tabular-nums for KPIs, 8px radius, 1px borders, no aurora gradients; match HomeDashboard panel/kpiBand language"

testing:
  runner: "vitest 4.1.10"
  command: "bun run test"
  config: "vitest.config.ts (globals, jsdom, setupFiles ./tests/setup.ts, 10s timeouts)"
  coverage:
    provider: "v8 (@vitest/coverage-v8)"
    command: "bun run test:coverage"
    reporters: ["text", "json", "html", "lcov"]
    excludes: ["node_modules/", "tests/", "**/*.d.ts", "**/*.config.*", "dist/", "mockData"]
    thresholds: { lines: 80, functions: 80, branches: 80, statements: 80 }
  layers:
    unit: { available: true, command: "bun run test:unit (vitest run tests/unit)", count: "~? (tests/unit/**/)" }
    integration: { available: true, command: "bun run test:integration" }
    security: { available: true, command: "bun run test:security" }
    e2e: { available: true, command: "bun run test:e2e (playwright 1.62.0, playwright.config.ts)", pwa: "bun run test:e2e:pwa" }
    load: { available: false }
  setup: "tests/setup.ts — jsdom, @testing-library/react, localStorage/sessionStorage & indexedDB mocks, matchMedia/IntersectionObserver"
  ci:
    workflow: ".github/workflows/* (if present), ci-cd/docs/*"
    coverage_artifact: "coverage/lcov.info + html"

quality_tools:
  linter: { available: true, command: "bun run lint (eslint 9.39.4, max-warnings 999)" }
  type_checker: { available: true, command: "bun run type-check (tsc --noEmit)" }
  formatter: { available: false, command: "— (eslint --fix available)" }
  security:
    audit: "bun audit --audit-level=moderate"
    full_audit: "bun run security:audit"

phases:
  proposal: { required: true, gate: "interactive question round (3–5 business questions) before finalizing; assumptions documented" }
  spec: { required: true, gate: "delta specs under openspec/changes/{change}/specs/{domain}/spec.md" }
  design: { required: true, gate: "technical design with affected areas and risks" }
  tasks: { required: true, gate: "tasks.md with sliced work units ≤400 lines (canonical), 800 allowed with ask-on-risk exception" }
  apply: { required: true, strict_tdd: true, gate: "tests first, no widening scope, preserve human consent gates" }
  verify: { required: true, gate: "tests + coverage + type-check + lint, verify-report.md" }
  archive: { required: true, gate: "merge deltas to openspec/specs and move to archive/YYYY-MM-DD-{change}" }

notes:
  externally_reformatted: "backPanel/services/auth.services.js was reformatted externally — re-read before editing (verified 2026-09-02). Also utils/auth-cookie.js, middleware/security.middleware.js, services/hetzner.services.js."
  cross_repo: "Primary root frontGMAO; secondary root backPanel (/home/jleone/work/backPanel) shares fix — tenants.services aggregation and dashboard data must stay aligned."
  redesign_context: "change super-admin-dashboard-redesign targets PanelAdmin minimal chrome (gradient title, isolated stat cards, disconnected charts) — parity with HomeDashboard (headerMetadata, kpiBand, resourceBand, analysisGrid, workGrid) required."
  env: "VITE_API_URL (/api/ fallback), VITE_API_PROXY_TARGET (https://api.leonix.net.ar), AUTH_COOKIE_DOMAIN, AUTH_COOKIE_SAMESITE, JWT_MAX_AGE_HOURS"
  engram_fallback: "artifact_store engram requested; openspec/config.yaml bootstrapped locally for resilience (hybrid-leaning). Save sdd-init/super-admin-dashboard-redesign to engram when tool available."
  review_budget_note: "800 lines ask-on-risk; shadcn adoption must be justified vs CSS-modules reuse — prefer sliced PRs if shadcn + tokens exceed 400."

skill_registry: ".atl/skill-registry.md (generated, last update 2026-09-02, 13 user skills indexed)"
